name: Codex Bootstrap Repository

on:
  push:
    branches:
      - main
    paths:
      - ".codex-bootstrap/**"
      - ".github/workflows/codex-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_CHUNKS: "8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace bootstrap tree with project archive
        run: |
          set -eu
          actual_chunks="$(find .codex-bootstrap -maxdepth 1 -name 'chunk-*.b64' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$actual_chunks" != "$EXPECTED_CHUNKS" ]; then
            echo "Waiting for all bootstrap chunks: $actual_chunks/$EXPECTED_CHUNKS"
            exit 0
          fi

          cat .codex-bootstrap/chunk-*.b64 | tr -d '\n' | base64 -d > /tmp/soya-repo.tar.gz

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/soya-repo.tar.gz -C .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Initial Soya ASN Router feed"
          git push
